services:
  # On-demand builder. Renders the static site into ./dist using a pinned
  # Python image — no Python needed on the host. Not started by `up`; run it
  # explicitly to (re)generate the site:
  #
  #     docker compose run --rm build            # publish current content
  #     docker compose run --rm build python build.py --out dist --drafts
  #
  # nginx serves ./dist live, so a rebuild appears immediately with no restart.
  build:
    build:
      context: .
      dockerfile: Dockerfile
    image: contextpress-builder:latest
    pull_policy: build           # build locally; never pull this from a registry
    working_dir: /src
    volumes:
      - ./app:/src/app:ro
      - ./themes:/src/themes:ro
      - ./content:/src/content:ro
      - ./build.py:/src/build.py:ro
      - ./dist:/src/dist         # writable: the generated site lands on the host
    profiles: ["tools"]          # excluded from `docker compose up`

  # Always-on web server. Serves the bind-mounted ./dist-webroot (the promoted
  # live site). deploy.sh renders into ./dist, then promotes it into
  # ./dist-webroot in place, so the swap is picked up without restarting.
  web:
    image: nginx:1.27-alpine
    pull_policy: missing         # pinned tag; pulled once, then cached locally
    container_name: contextpress
    restart: unless-stopped
    volumes:
      - ./dist-webroot:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"                     # only on the npm network, no host port
    networks:
      - npm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  npm:
    external: true
    name: nginx-proxy-manager_default
