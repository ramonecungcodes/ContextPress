<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.tagline }}" />
{% if not site.robots.allow %}<meta name="robots" content="noindex, nofollow" />
{% endif %}
<link rel="icon" href="{{ site.favicon or static_url('favicon.svg') }}" />
<link rel="stylesheet" href="{{ static_url('css/style.css') }}" />
<style>
  .splash {
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    gap: 18px; padding: 40px 24px;
  }
  .splash h1 {
    font-family: var(--mono); font-weight: 600;
    font-size: clamp(28px, 6vw, 52px); letter-spacing: -.01em; margin: 0;
  }
  .splash h1 .prompt { color: var(--accent); }
  .splash h1 .cursor { color: var(--accent); animation: blink 1.1s steps(1) infinite; }
  .splash p { color: var(--ink-soft); font-size: 17px; max-width: 40ch; margin: 0; }
</style>
</head>
<body>
  <main class="splash">
    {% if site.tagline %}<div class="status"><span class="led"></span> {{ site.tagline }}</div>{% endif %}
    <h1><span class="prompt">$ </span>{{ site.author or site.title }}<span class="cursor">_</span></h1>
    <p>Something is compiling. The site goes live soon — check back shortly.</p>
    {% if site.social.email %}<p class="mono"><a href="mailto:{{ site.social.email }}">$ mail {{ site.author or "me" }}</a></p>{% endif %}
  </main>
</body>
</html>
