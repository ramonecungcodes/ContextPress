<section class="section prose"{% if w.id %} id="{{ w.id }}"{% endif %}>
  {% if w.prompt %}<p class="prompt">{{ w.prompt }}</p>{% endif %}
  {% for p in w.paragraphs %}<p>{{ p }}</p>{% endfor %}
  {% if w.readmore %}<a class="readmore" href="{{ w.readmore.href }}">{{ w.readmore.label }}</a>{% endif %}
</section>
