<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.tagline }}{% endblock %}" />
{% if not site.robots.allow %}<meta name="robots" content="noindex, nofollow" />
{% endif %}
{% block head_extra %}{% endblock %}
{% include "partials/favicon.html" %}
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="/feed.xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ static_url('css/style.css') }}" />
<link rel="stylesheet" href="{{ static_url('css/pygments.css') }}" />
</head>
<body>

{% include "partials/nav.html" %}

<main class="wrap">
{% block content %}{% endblock %}
</main>

{% include "partials/footer.html" %}

</body>
</html>
