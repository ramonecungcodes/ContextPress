  - widget: prose
    id: about
    prompt: "cat about.md"
    paragraphs:
      - >-
        I'm an AI engineer with 9+ years across software, systems integration,
        and automation in federal, local-government, and enterprise
        environments. What I care about most is the part that comes after the
        demo: taking LLMs, embeddings, and agents and turning them into systems
        that actually run, and keep running, in production.
      - >-
        Day to day that means working with models and local inference (LM
        Studio, Ollama, GGUF), designing retrieval (hybrid full-text + vector
        search over pgvector and SQLite-Vec), exposing services to agents over
        MCP, and packaging the whole thing as Docker Compose stacks I can deploy
        and evolve through CI. Behind that sits Python, PostgreSQL, REST/FastAPI,
        AWS, and Nginx/reverse-proxy plumbing.
      - >-
        I bring production habits even to personal projects: least-privilege
        network boundaries, data provenance for embeddings, reversible
        migrations, observable async work, and testing gates before deploy. I'd
        rather ship something honest about its limits than a demo that hides
        them.
    readmore: { label: "read the full résumé →", href: "/ramon-ecung-resume.html" }

  - widget: contributions
    id: activity
    prompt: "git log --graph"
    username: ramonecungcodes
    color: "00ad8d"          # theme teal (accent hue 175); ghchart drops the #
    href: "https://github.com/ramonecungcodes"
    caption: "A year of public commits on GitHub. Most of my work also lives in private and self-hosted repos."

  - widget: cards
    id: work
    prompt: "ls ~/work"
    items:
      - title: "Media Tube: private, self-hosted media platform"
        sub: "Python · FastAPI · PostgreSQL/pgvector · Docker Compose · S3 · durable job workers"
        feature: true
        bullets:
          - "Grew from three scripts into a containerized system with a service boundary, durable background workers (leases, heartbeats, retries), and object storage behind an authenticated API."
          - "Semantic + full-text search with embeddings keyed by model provenance: a model switch never silently mixes incompatible vectors."
          - "AI-assisted tagging, transcription workflows, and CPU face detection/grouping as an isolated stateless service."
          - "Graduated testing: 133+ test modules, Ruff/Semgrep/ESLint security gates, a schema-aware SQL gate, and Playwright on Chromium and WebKit as a deploy gate."
        tags: ["pgvector", "FastAPI", "Docker Compose", "Playwright", "least-privilege"]
        links:
          - { label: "Read the writeup", href: "/blog/media-tube-media-platform/" }
          - { label: "Testing strategy", href: "/blog/media-tube-testing-strategy/" }
          - { label: "Coverage report", href: "/projects/media-tube/reports/media-tube-test-coverage-report-2026-08-27/" }
      - title: "Messages Archive: AI-native, private message archive"
        sub: "Python · FastAPI · SQLite (FTS5 + Vec) · Ollama · MCP · Tailscale"
        bullets:
          - "Append-only archive that preserves message revision history: what did I observe and when, not just current state."
          - "Local natural-language retrieval: Nomic embeddings + a read-only FastMCP tool surface, with a visible AI audit trail."
          - "Model selection as a systems problem on a 32 GB CPU-only host: residency limits, serialized inference, queued work."
        tags: ["embeddings", "FastMCP", "SQLite-Vec", "local LLM"]
        links:
          - { label: "Read the writeup", href: "/blog/messages-archive/" }
      - title: "AI Search, Embeddings & Retrieval"
        sub: "Semantic retrieval · hybrid indexing · LLM tool integration"
        bullets:
          - "Hybrid search combining PostgreSQL full-text, metadata filtering, and vector retrieval."
          - "Benchmarked pgvector, SQLite-Vec, and relational storage on performance, indexing, and consistency."
          - "Embedding lifecycle strategies for model changes, re-indexing, and versioning."
          - "FastMCP servers exposing app services as structured tools for local LLM agents."
        tags: ["Nomic", "hybrid search", "MCP"]
      - title: "Local LLM & Agentic Dev Environment"
        sub: "Evaluating models, coding agents & autonomous workflows"
        bullets:
          - "Deploy/evaluate LLMs on Apple Silicon (up to 64 GB unified) with LM Studio & GGUF."
          - "Agent workflows separating spec/architecture from implementation, testing, and review."
          - "Repo-level context files, isolated worktrees, testing gates, and phased commits for reliable autonomous coding."
        tags: ["LM Studio", "GGUF", "Claude Code", "agents"]
      - title: "ContextPress: this site's engine"
        sub: "Static-site generator · Docker · build-time AI config"
        bullets:
          - "Python + Jinja2 + markdown generator with typed (Pydantic) config validation."
          - "Theme & page bundles, content-hash cache-busting, RSS/sitemap/robots generation."
          - "Bind-mounted output served by pinned Nginx; on-demand builder container, restart-free updates."
        tags: ["Python", "Jinja2", "Docker", "Nginx"]
        links:
          - { label: "GitHub", href: "https://github.com/ramonecungcodes/ContextPress" }
    note: "More project repositories are being published over the coming weeks. In the meantime, the write-ups below go deep on the architecture and engineering decisions."

