# Which template renders "/":
#   index        -> the blog home (hero + latest posts)
#   coming-soon  -> a pre-launch splash (pair with robots.allow: false)
home: "index"

# Crawler policy -> robots.txt + sitemap.xml + a noindex meta when blocked.
robots:
  allow: true       # false blocks all crawlers (use during the coming-soon phase)
  sitemap: true     # emit /sitemap.xml

