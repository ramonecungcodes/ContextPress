  - widget: prose
    id: about
    prompt: "cat about.md"
    paragraphs:
      - >-
        I'm a Senior UiPath RPA developer with 9+ years in software and
        automation across federal, local-government, and enterprise
        environments, 4+ of them hands-on in UiPath Studio and Orchestrator. I
        own the complete automation lifecycle: process discovery and
        feasibility, requirements, PDDs and SDDs, development with REFramework
        patterns, testing and UAT, Orchestrator deployment, monitoring, and
        hypercare.
      - >-
        I build for maintainability and reliability: reusable components,
        exception handling, automation governance, and Orchestrator queues,
        triggers, and retry strategies that let unattended bots recover from
        transient failures. I keep the bot fleet in Git with pull-request
        reviews and automated tests, because production automation is software.
      - >-
        I also build production software and modern AI systems: Python services,
        local LLMs, retrieval, and Document Understanding. I'm focused on where
        automation and AI meet: intelligent, document-driven automation. That
        combination is rare on RPA teams, and it's the work I want to be doing.
    readmore: { label: "read the full résumé →", href: "/ramon-ecung-rpa-resume.html" }

