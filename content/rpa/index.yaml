  - widget: cards
    id: work
    prompt: "ls ~/side-projects"
    intro: "Beyond RPA, I build and operate production-grade software and AI systems on my own hardware. For an automation team this is where intelligent automation is heading, and it's the toolkit I bring: durable job systems, document and vision AI, retrieval, and the operational discipline to run it in production."
