        sub: "Python · FastAPI · PostgreSQL/pgvector · Docker Compose · durable job workers"
        feature: true
        bullets:
          - "Grew from three scripts into a containerized system with a service boundary and durable background workers (leases, heartbeats, retries): the same reliability patterns that matter for unattended automation."
          - "AI-assisted tagging, transcription, and vision workflows, each with a human-in-the-loop review queue so the automation stays trustworthy."
          - "Graduated testing: 133+ test modules, Ruff/Semgrep/ESLint security gates, a schema-aware SQL gate, and Playwright on Chromium and WebKit as a deploy gate."
        tags: ["durable jobs", "document/vision AI", "testing gates", "Docker"]
        links:
