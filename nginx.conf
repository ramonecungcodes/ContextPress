server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /posts/slug/ -> /posts/slug/index.html; unknown -> 404 page.
    location / {
        try_files $uri $uri/ =404;
    }

    # Static assets carry a content-hash query (?v=...) from the build, so a
    # changed file gets a new URL — safe to cache aggressively and immutably.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /feed.xml {
        add_header Content-Type application/rss+xml;
    }

    gzip on;
    gzip_types text/css application/rss+xml application/javascript image/svg+xml;
    gzip_min_length 512;

    # Minimal hardening; NPM/Cloudflare add TLS and the rest in front of this.
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;
}
